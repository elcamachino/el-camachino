<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL CAMACHINO — Control de Pedidos</title>
<style>
  .brand-logo {
  width: 40px;
  height: 40px;
  object-fit: contain;
  vertical-align: middle;
}
:root{
  --green:#0d8f73; --green2:#13b892; --turq:#13bfc1; --dark:#17313a;
  --muted:#6b7c83; --bg:#edf7f5; --white:#fff; --line:#dce9e7;
  --danger:#d84b4b; --shadow:0 8px 24px rgba(17,63,67,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#087d69,#13a98c);color:white;padding:14px 18px;box-shadow:0 3px 14px #1234}
.topbar-inner{max-width:1500px;margin:auto;display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{font-size:22px;font-weight:900;letter-spacing:.3px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:#ffffff1c;border:1px solid #ffffff35;border-radius:12px;padding:8px 13px;min-width:130px}
.stat b{display:block;font-size:17px}.stat span{font-size:11px;opacity:.9}
.layout{max-width:1500px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}
.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.catalog-panel{padding:16px}
.search-row{display:flex;gap:10px;margin-bottom:14px}
.search-row input{flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:12px;outline:none}
.search-row input:focus{border-color:var(--turq);box-shadow:0 0 0 3px #13bfc11a}
.categories{display:flex;gap:8px;overflow:auto;padding-bottom:12px}
.cat-btn{border:1px solid var(--line);background:#f7fbfa;color:var(--dark);padding:10px 14px;border-radius:999px;white-space:nowrap;font-weight:800;cursor:pointer;touch-action:manipulation}
.cat-btn.active{background:var(--green);color:white;border-color:var(--green)}
.cat-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.cat-title h2{font-size:18px;margin:0}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
.product{border:1px solid var(--line);background:#fbfefd;border-radius:14px;padding:14px;min-height:112px;text-align:left;transition:.12s}
.product:hover{transform:translateY(-1px);border-color:#8ed9cd;box-shadow:0 5px 14px #1232}
.product .name{font-weight:850;line-height:1.2}.product .desc{font-size:12px;color:var(--muted);margin-top:5px}.product .price{font-size:19px;font-weight:900;color:var(--green);margin-top:12px}
.cart{position:sticky;top:90px;height:max-content;padding:16px}
.cart h2{margin:0 0 10px;font-size:19px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.cart-items{max-height:355px;overflow:auto}
.cart-item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item-head{display:flex;justify-content:space-between;gap:8px}.item-name{font-weight:850}.item-price{font-weight:900;color:var(--green)}
.opts{font-size:12px;color:#526970;margin:5px 0}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qty button{width:29px;height:29px;border:0;border-radius:8px;background:#e8f5f2;color:var(--green);font-weight:900}.remove{margin-left:auto;border:0;background:transparent;color:var(--danger);font-size:12px}
.form{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:grid;gap:8px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;outline:none}
.form textarea{resize:vertical;min-height:55px}
.form label{font-size:11px;font-weight:800;color:#536a70;margin-bottom:-5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.total-box{margin-top:10px;padding:12px;border-radius:12px;background:#f0faf8}
.total-line{display:flex;justify-content:space-between;align-items:center;margin:4px 0}.total{font-size:25px;font-weight:950;color:var(--green)}
.change{font-size:17px;font-weight:900}.negative{color:var(--danger)}
.save{width:100%;border:0;border-radius:12px;padding:13px;background:var(--green);color:white;font-weight:900;margin-top:8px}
.save:disabled{opacity:.5;cursor:not-allowed}
.history{max-width:1500px;margin:0 auto 30px;padding:0 16px}
.history-panel{padding:16px}
.history-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.history-head h2{margin:0;font-size:19px}.history-list{display:grid;gap:9px;margin-top:12px}
.order{border:1px solid var(--line);border-radius:13px;padding:12px;background:white}
.order-top{display:flex;gap:10px;align-items:center;justify-content:space-between}.order-num{font-weight:950;font-size:17px}
.badge{font-size:11px;font-weight:900;padding:5px 9px;border-radius:999px}
.pend{background:#fff3c7;color:#846600}.prep{background:#dff0ff;color:#12649a}.ready{background:#dff7e8;color:#18703d}.deliv{background:#edf0f2;color:#536169}
.order-meta{font-size:12px;color:#65777d;margin:6px 0}.order-products{font-size:13px;line-height:1.45}.order-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.small-btn{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 10px;font-weight:800;color:var(--dark)}.small-btn:hover{border-color:#8bd3c7}
.next-btn{background:#e6f7f3;border-color:#b7e4dc;color:#087d69}
.delete-btn{color:var(--danger)}
.modal-back{position:fixed;inset:0;background:#092d3188;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal-back.show{display:flex}.modal{background:white;border-radius:17px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:19px;box-shadow:0 20px 60px #0004}
.modal h3{margin:0 0 14px}.modal-section{margin:13px 0}.modal-section>strong{display:block;font-size:13px;margin-bottom:7px}
.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt-btn{border:1px solid var(--line);background:#f8fcfb;border-radius:10px;padding:10px;font-weight:750}.opt-btn.selected{background:#dff7f1;border-color:var(--green);color:#076c59}
.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);font-weight:900}.confirm{background:var(--green);color:white;border-color:var(--green)!important}
.toast{position:fixed;right:18px;bottom:18px;background:#17313a;color:white;padding:12px 15px;border-radius:10px;display:none;z-index:100;box-shadow:var(--shadow)}.toast.show{display:block}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.cart{position:static}.cart-items{max-height:none}}
@media(max-width:650px){.topbar-inner{align-items:flex-start;flex-direction:column}.stats{width:100%;justify-content:stretch}.stat{flex:1;min-width:0}.product-grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.layout,.history{padding:0 9px}.catalog-panel,.cart,.history-panel{padding:12px}}


.delivery-address textarea{min-height:68px}
.admin-modal{max-width:760px}
.admin-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.admin-list{display:grid;gap:8px}
.admin-row{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfefd}
.admin-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.admin-row-name{font-weight:900}
.admin-muted{font-size:11px;color:var(--muted)}
.admin-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.admin-actions button{flex:1}
.admin-form{display:grid;gap:9px}
.admin-form label{font-size:11px;font-weight:800;color:#536a70}
.admin-form input,.admin-form select,.admin-form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white}
.admin-checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.admin-check{border:1px solid var(--line);padding:9px;border-radius:10px;background:#f8fcfb;font-weight:700}
.admin-check input{width:auto;margin-right:7px}
@media(max-width:650px){
  .admin-modal{max-height:94vh}
  .admin-checks{grid-template-columns:1fr}
  .admin-row-top{align-items:flex-start}
}

.top-admin{border:1px solid #ffffff55;background:#ffffff1c;color:white;border-radius:11px;padding:8px 10px;font-weight:900}
@media(max-width:650px){.top-admin{display:block}}

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><img src="ilustracion.png" class="brand-logo"> EL CAMACHINO — Control de Pedidos</div><button class="top-admin" id="topAdminBtn" type="button">⚙️</button><button class="mobile-top-cart" id="mobileTopCart" type="button">🛒 <span id="mobileTopCount">0</span></button>
    <div class="stats">
      <div class="stat"><b id="todayOrders">0</b><span>PEDIDOS DE HOY</span></div>
      <div class="stat"><b id="todaySales">$0</b><span>VENTAS DE HOY</span></div>
      <div class="stat"><b id="todayPending">0</b><span>PENDIENTES</span></div>
    </div>
  </div>
</header>


<div class="mobile-cart-bar" id="mobileCartBar">
  <button id="mobileCartOpen" type="button">
    <span>🛒 Pedido</span>
    <b id="mobileCartCount">0</b>
    <strong id="mobileCartTotal">$0</strong>
  </button>
</div>
<div class="mobile-cart-backdrop" id="mobileCartBackdrop"></div>

<main class="layout">
<section class="panel catalog-panel">
  <div class="search-row"><input id="productSearch" placeholder="🔎 Buscar producto..." autocomplete="off"></div>
  <div class="categories" id="categories"></div>
  <div class="cat-title"><h2 id="catTitle">Aguachile</h2><span id="productCount"></span></div>
  <div class="product-grid" id="productGrid"></div>
</section>

<aside class="panel cart">
  <h2>🛒 Pedido actual</h2>
  <div id="cartItems" class="cart-items"><div class="empty">Agrega productos al pedido.</div></div>

  <div class="form">
    <div class="two">
      <div><label>Nombre del cliente</label><input id="customer" placeholder="Opcional"></div>
      <div><label>Teléfono</label><input id="phone" placeholder="Opcional" inputmode="tel"></div>
    </div>
    <div class="two">
      <div><label>Horario solicitado (opcional)</label><input id="requestedTime" type="time"></div>
      <div><label>Tipo de pedido</label>
        <select id="orderType"><option>Para recoger</option><option>Comer aquí</option><option>Entrega</option></select>
      </div>
    </div>
    <div id="deliveryAddressWrap" class="delivery-address" style="display:none">
      <label>📍 Domicilio de entrega</label>
      <textarea id="deliveryAddress" placeholder="Calle, número, colonia, referencias..."></textarea>
    </div>
    <div><label>Notas</label><textarea id="notes" placeholder="Instrucciones especiales..."></textarea></div>
    <div class="two">
      <div><label>Forma de pago</label>
        <select id="paymentMethod">
          <option value="Efectivo">💵 Efectivo</option>
          <option value="Transferencia">🏦 Transferencia</option>
        </select>
      </div>
      <div><label>Pago del cliente</label><input id="payment" type="number" min="0" step="0.01" placeholder="$0"></div>
    </div>
    <div class="total-box" style="margin-top:0">
        <div class="total-line"><span>Total</span><b id="cartTotal" class="total">$0</b></div>
        <div class="total-line"><span>Cambio</span><b id="change" class="change">$0</b></div>
      </div>
    </div>
    <div style="display:flex;gap:8px"><button class="save" id="saveBtn" style="flex:1">💾 GUARDAR PEDIDO</button><button class="small-btn" id="cancelEditBtn" style="display:none;flex:0 0 auto">Cancelar edición</button></div>
  </div>
</aside>
</main>

<section class="history">
 <div class="panel history-panel">
  <div class="history-head">
    <h2>📋 Pedidos guardados</h2>
    <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;flex:1;justify-content:flex-end">
      <input id="orderSearch" style="max-width:350px;flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:10px" placeholder="🔎 Número, cliente o producto">
      <button class="small-btn" id="adminBtn">⚙️ Administración</button><button class="small-btn" id="exportBackup">💾 Exportar respaldo</button>
      <button class="small-btn" id="importBackupBtn">📥 Importar respaldo</button>
      <input id="importBackup" type="file" accept="application/json,.json" hidden>
    </div>
  </div>
  <div id="ordersList" class="history-list"></div>
 </div>
</section>

<div id="modalBack" class="modal-back">
 <div class="modal">
   <h3 id="modalTitle"></h3>
   <div id="modalBody"></div>
   <div class="modal-actions"><button id="cancelModal">Cancelar</button><button class="confirm" id="confirmModal">Agregar al pedido</button></div>
 </div>
</div>

<div id="adminBack" class="modal-back">
  <div class="modal admin-modal">
    <h3>⚙️ Administración</h3>
    <div class="admin-tabs">
      <button class="small-btn" id="adminNew">➕ Nuevo producto</button>
      <button class="small-btn" id="adminNewCat">📂 Nueva categoría</button>
    </div>
    <div id="adminBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="printArea"></div>

function loadCatalog(){
  try{
    const saved=JSON.parse(localStorage.getItem(catalogKey)||"null");
    if(!saved || !Array.isArray(saved.products)) return;
    CATEGORIES = Array.isArray(saved.categories)&&saved.categories.length ? saved.categories : baseCategories.slice();
    PRODUCTS = saved.products.map(p=>({...p}));
  }catch(e){
    CATEGORIES=baseCategories.slice();
    PRODUCTS=JSON.parse(JSON.stringify(baseProducts));
  }
}
async function syncCatalogFromSupabase(){
  try{
    const [{data:cats,error:ce},{data:prods,error:pe}]=await Promise.all([
      supabaseClient.from("categorias").select("id,nombre,orden").order("orden",{ascending:true}),
      supabaseClient.from("productos").select("*").order("id",{ascending:true})
    ]);
    if(ce) throw ce; if(pe) throw pe;
    if(Array.isArray(cats) && cats.length){
      CATEGORIES=cats.map(c=>c.nombre);
      const catMap=new Map(cats.map(c=>[String(c.id),c.nombre]));
      PRODUCTS=(prods||[]).map(p=>({
        id:String(p.id),
        cat:catMap.get(String(p.categoria_id))||p.categoria||"General",
        name:p.nombre||"",
        price:Number(p.precio||0),
        desc:p.descripcion||p.desc||"",
        active:p.activo!==false,
        allowMango:p.ask_mango_choice===true || p.allow_mango===true,
        allowPulpo:p.allow_pulpo===true,
        askColor:p.ask_color===true,
        askSpicy:p.ask_spicy===true,
        askTostitosColor:p.ask_tostitos_color===true,
        askShrimpStyle:p.ask_shrimp_style===true,
        modal:p.modal||"",
        size:p.tamano||p.size||""
      }));
      localStorage.setItem(catalogKey,JSON.stringify({version:2,categories:CATEGORIES,products:PRODUCTS}));
      supabaseReady=true;
      if(!CATEGORIES.includes(state.category)) state.category=CATEGORIES[0]||"General";
      renderCatalog();renderAdmin();
      toast("☁️ Catálogo sincronizado");
    }
  }catch(e){
    console.error("Supabase catálogo:",e);
    toast("⚠️ No se pudo sincronizar catálogo");
  }
}

async function saveProductToSupabase(p){
  const {data:cats,error:ce}=await supabaseClient.from("categorias").select("id,nombre");
  if(ce) throw ce;
  const cat= (cats||[]).find(c=>c.nombre===p.cat);
  if(!cat) throw new Error("Categoría no encontrada: "+p.cat);
  const row={
    nombre:p.name,
    precio:Number(p.price||0),
    categoria_id:cat.id,
    descripcion:p.desc||"",
    activo:p.active!==false,
    ask_mango_choice:p.allowMango===true,
    allow_pulpo:p.allowPulpo===true,
    ask_color:p.askColor===true,
    ask_spicy:p.askSpicy===true,
    ask_tostitos_color:p.askTostitosColor===true,
    ask_shrimp_style:p.askShrimpStyle===true,
    modal:p.modal||null
  };
  if(p.id && !String(p.id).startsWith("prod-")){
    const {data,error}=await supabaseClient.from("productos").update(row).eq("id",p.id).select("*").single();
    if(error) throw error;
    p.id=String(data.id);
    return data;
  }
  const {data,error}=await supabaseClient.from("productos").insert(row).select("*").single();
  if(error) throw error;
  p.id=String(data.id);
  return data;
}

async function saveCategoryToSupabase(name){
  const {data,error}=await supabaseClient.from("categorias").insert({nombre:name,orden:CATEGORIES.length}).select("*").single();
  if(error) throw error;
  return data;
}

// ===== SUPABASE REALTIME =====
let realtimeChannels=[];

async function syncOrdersFromSupabase(){
  try{
    const {data,error}=await supabaseClient.from("pedidos").select("id,numero,fecha,pago,cambio,estado,datos").order("created_at",{ascending:true});
    if(error) throw error;
    if(!Array.isArray(data)) return;
    const mapped=data.map(row=>{
      let o={};
      try{o=typeof row.datos==='string'?JSON.parse(row.datos):(row.datos||{});}catch(e){o={};}
      return {...o,id:String(row.id),number:row.numero||o.number||"",date:row.fecha||o.date||"",payment:row.pago??o.payment??0,change:row.cambio??o.change??0,status:row.estado||o.status||"Pendiente"};
    });
    saveOrders(mapped);
    renderOrders();updateStats();
  }catch(e){console.error("Supabase pedidos:",e);}
}

function subscribeRealtime(){
  realtimeChannels.forEach(ch=>{try{supabaseClient.removeChannel(ch)}catch(e){}});
  realtimeChannels=[];
  const catalogCh=supabaseClient.channel("el-camachino-catalogo-realtime")
    .on("postgres_changes",{event:"*",schema:"public",table:"productos"},async()=>{await syncCatalogFromSupabase();toast("⚡ Catálogo actualizado");})
    .on("postgres_changes",{event:"*",schema:"public",table:"categorias"},async()=>{await syncCatalogFromSupabase();toast("⚡ Categorías actualizadas");})
    .subscribe(status=>console.log("Realtime catálogo:",status));
  const ordersCh=supabaseClient.channel("el-camachino-pedidos-realtime")
    .on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},async payload=>{
      const row=payload.new||payload.old;if(!row)return;
      const current=loadOrders();
      if(payload.eventType==="DELETE"){
        saveOrders(current.filter(o=>String(o.id)!==String(row.id)));renderOrders();updateStats();toast("⚡ Pedido eliminado");return;
      }
      let o={};try{o=typeof row.datos==='string'?JSON.parse(row.datos):(row.datos||{});}catch(e){}
      o={...o,id:String(row.id),number:row.numero||o.number||"",date:row.fecha||o.date||"",payment:row.pago??o.payment??0,change:row.cambio??o.change??0,status:row.estado||o.status||"Pendiente"};
      const idx=current.findIndex(x=>String(x.id)===String(o.id));
      if(idx>=0)current[idx]=o;else current.push(o);
      saveOrders(current);renderOrders();updateStats();
      toast(payload.eventType==="INSERT"?"⚡ Nuevo pedido":"⚡ Pedido actualizado");
    })
    .subscribe(status=>console.log("Realtime pedidos:",status));
  realtimeChannels.push(catalogCh,ordersCh);
}

async function saveOrderToSupabase(order){
  const row={numero:order.number,fecha:order.date,pago:Number(order.payment||0),cambio:Number(order.change||0),estado:order.status||"Pendiente",datos:order};
  // Al crear un pedido NO enviamos `id`: Supabase lo genera porque es GENERATED ALWAYS.
  // Al editar un pedido existente sí usamos su id generado por Supabase.
  if(order.id && /^\d+$/.test(String(order.id))){
    const {data,error}=await supabaseClient.from("pedidos").update(row).eq("id",Number(order.id)).select("*").single();
    if(error)throw error;
    return data;
  }
  const {data,error}=await supabaseClient.from("pedidos").insert(row).select("*").single();
  if(error)throw error;
  if(data && data.id!=null) order.id=String(data.id);
  return data;
}
async function deleteOrderFromSupabase(id){
  const {error}=await supabaseClient.from("pedidos").delete().eq("id",id);
  if(error)throw error;
}

/* Configuración de opciones. También permite que Administración controle productos nuevos. */
function catalogConfigFor(p){
  const modal=p.modal||"";
  return {
    askTostitosColor: !!p.askTostitosColor || modal==="tostiaguachile",
    askColor: !!p.askColor || modal==="aguachile" || modal==="tostiaguachile" || modal==="tostadaAguachile",
    askSpicy: !!p.askSpicy || modal==="aguachile" || modal==="tostiaguachile" || modal==="tostadaAguachile",
    allowMango: p.allowMango===true || modal==="aguachile" || modal==="tostiaguachile" || modal==="ceviche",
    allowPulpo: p.allowPulpo===true || modal==="aguachile" || modal==="tostiaguachile" || modal==="tostadaExtras" || modal==="tostadaAguachile",
    askShrimpStyle: p.askShrimpStyle===true || p.ask_shrimp_style===true,
    modal
  };
}


function loadOrders(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return []}}
function saveOrders(a){localStorage.setItem(key,JSON.stringify(a))}
function todayKey(d=new Date()){return d.toLocaleDateString("en-CA",{timeZone:"America/Mexico_City"})}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function productById(id){return PRODUCTS.find(p=>p.id===id)}
function cartItemKey(item){return JSON.stringify({id:item.id,opts:item.options||{}})}
function cartTotal(){return state.cart.reduce((s,i)=>s+i.price*i.qty,0)}

function renderCategories(){
  $("categories").innerHTML=CATEGORIES.map(c=>`<button class="cat-btn ${c===state.category?"active":""}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join("");
  document.querySelectorAll(".cat-btn").forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;renderCatalog()});
}
function renderCatalog(){
  renderCategories();
  const q=$("productSearch").value.trim().toLowerCase();
  let list=PRODUCTS.filter(p=>p.active!==false && p.cat===state.category);
  if(q) list=PRODUCTS.filter(p=>p.active!==false && (p.name+" "+p.cat+" "+(p.desc||"")).toLowerCase().includes(q));
  $("catTitle").textContent=q?"Resultados de búsqueda":state.category;
  $("productCount").textContent=list.length+" productos";
  $("productGrid").innerHTML=list.map(p=>`
    <button class="product" data-id="${p.id}">
      <div class="name">${escapeHTML(p.name)}</div>
      ${p.desc?`<div class="desc">${escapeHTML(p.desc)}</div>`:""}
      <div class="price">${money(p.price)}</div>
    </button>`).join("");
  document.querySelectorAll(".product").forEach(b=>b.onclick=()=>addProduct(productById(b.dataset.id)));
}

function addProduct(p){
  if(p.modal){openModal(p);return}
  addConfigured(p,{});
}
function addConfigured(p,options){
  const temp={id:p.id,name:p.name,basePrice:p.price,price:p.price,qty:1,options};
  const k=cartItemKey(temp);
  const existing=state.cart.find(i=>cartItemKey(i)===k);
  if(existing) existing.qty++;
  else state.cart.push(temp);
  renderCart();
  toast("Producto agregado");
}
function optionText(o){
  const a=[];
  if(o.tostitosColor)a.push("Tostitos: "+o.tostitosColor);
  if(o.aguachileColor)a.push("Aguachile: "+o.aguachileColor);
  if(o.spicy)a.push("Picor: "+o.spicy);
  if(o.mango)a.push("Extra mango");
  if(o.pulpo)a.push("Pulpo");
  return a;
}
function renderCart(){
  const el=$("cartItems");
  if(!state.cart.length){el.innerHTML='<div class="empty">Agrega productos al pedido.</div>'}
  else el.innerHTML=state.cart.map((i,idx)=>`
    <div class="cart-item">
      <div class="item-head"><div class="item-name">${i.qty}× ${escapeHTML(i.name)}</div><div class="item-price">${money(i.price*i.qty)}</div></div>
      <div class="opts">${optionText(i.options).map(escapeHTML).join("<br>")}</div>
      <div class="qty">
        <button data-act="minus" data-i="${idx}">−</button><b>${i.qty}</b><button data-act="plus" data-i="${idx}">+</button>
        <button class="remove" data-act="remove" data-i="${idx}">Eliminar</button>
      </div>
    </div>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,act=b.dataset.act;
    if(act==="minus"){state.cart[i].qty--;if(state.cart[i].qty<=0)state.cart.splice(i,1)}
    if(act==="plus")state.cart[i].qty++;
    if(act==="remove")state.cart.splice(i,1);
    renderCart();
  });
  const total=cartTotal(), method=$("paymentMethod").value;
  const pay=method==="Transferencia" ? total : Number($("payment").value||0);
  const change=pay-total;
  $("cartTotal").textContent=money(total);
  $("change").textContent=money(Math.max(0,change));
  $("change").classList.toggle("negative",method==="Efectivo"&&pay>0&&change<0);
  $("saveBtn").disabled=state.cart.length===0 || (method==="Efectivo"&&pay<total);
}

function openModal(p){
  state.modalProduct=p;
  state.modalSelections={};
  const cfg=catalogConfigFor(p);
  let html="";

  if(cfg.modal==="ceviche"){
    html += section("¿Con mango?",["Sin mango","Con mango +$5"],"mangoChoice");
  }
  if(cfg.askTostitosColor) html += section("Color de Tostitos",["Verde","Morado"],"tostitosColor");
  if(cfg.askColor) html += section("Color del aguachile",["Negro","Verde","Rojo"],"aguachileColor");
  if(cfg.askSpicy) html += section("Intensidad de picor",["Normal","Extra picante"],"spicy");

  const checksKeys=[];
  if(cfg.allowMango && cfg.modal!=="ceviche") checksKeys.push("mango");
  if(cfg.allowPulpo) checksKeys.push("pulpo");
  if(checksKeys.length) html += checks(checksKeys);

  if(cfg.askShrimpStyle) html += section("¿Cómo quieres el camarón?",["Cocido","Curtido"],"camaronPreparacion");
  if(cfg.modal==="tostadaExtras"){
    html += section("¿Con mango?",["Sin mango","Con mango +$5"],"mangoChoice");
  }

  $("modalTitle").textContent=p.name;
  $("modalBody").innerHTML=html || '<div class="empty">No hay opciones para este producto.</div>';
  $("modalBack").classList.add("show");
  bindModal();
}
function section(title,opts,keyName){
  return `<div class="modal-section"><strong>${title}</strong><div class="option-grid">${opts.map(o=>`<button class="opt-btn" data-key="${keyName}" data-value="${o}">${o}</button>`).join("")}</div></div>`;
}
function checks(keys){
  return `<div class="modal-section"><strong>Extras</strong><div class="option-grid">${keys.map(k=>`<button class="opt-btn" data-check="${k}">${k==="mango"?"Extra mango +$5":"Pulpo +$5"}</button>`).join("")}</div></div>`;
}
function bindModal(){
  document.querySelectorAll("#modalBody .opt-btn").forEach(b=>b.onclick=()=>{
    if(b.dataset.check){
      state.modalSelections[b.dataset.check]=!state.modalSelections[b.dataset.check];
      b.classList.toggle("selected",!!state.modalSelections[b.dataset.check]);
    }else{
      state.modalSelections[b.dataset.key]=b.dataset.value;
      document.querySelectorAll(`#modalBody [data-key="${b.dataset.key}"]`).forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
    }
  });
}
$("cancelModal").onclick=()=>$("modalBack").classList.remove("show");
$("modalBack").onclick=e=>{if(e.target===$("modalBack"))$("modalBack").classList.remove("show")};
$("confirmModal").onclick=()=>{
  const p=state.modalProduct,o=state.modalSelections,cfg=catalogConfigFor(p);
  const required=[];

  if(cfg.askColor && !o.aguachileColor) required.push("color del aguachile");
  if(cfg.askSpicy && !o.spicy) required.push("intensidad de picor");
  if(cfg.askTostitosColor && !o.tostitosColor) required.push("color de Tostitos");

  if((cfg.modal==="ceviche" || cfg.modal==="tostadaExtras") && !o.mangoChoice)
    required.push("si lleva mango o no");

  if(cfg.askShrimpStyle && !o.camaronPreparacion)
    required.push("si el camarón es cocido o curtido");

  if(required.length){
    toast("Selecciona: "+required.join(" y "));
    return;
  }

  const mangoFromChoice=o.mangoChoice && o.mangoChoice.startsWith("Con mango");
  const price=p.price + ((o.mango===true || mangoFromChoice)?5:0) + (o.pulpo?5:0);
  const options={...o};
  if(mangoFromChoice) options.mango=true;
  if(o.mangoChoice) delete options.mangoChoice;

  const temp={id:p.id,options};
  const existing=state.cart.find(i=>cartItemKey(i)===cartItemKey(temp));
  if(existing){
    existing.qty++;
    existing.price=price;
  }else{
    state.cart.push({id:p.id,name:p.name,basePrice:p.price,price,qty:1,options});
  }

  $("modalBack").classList.remove("show");
  renderCart();
  toast("Producto agregado");
};

function makeOrderNumber(dateStr,orders){
 const nums=orders.filter(o=>o.date===dateStr).map(o=>Number(o.number.replace("#",""))||0);
 return "#"+String((Math.max(0,...nums)+1)).padStart(3,"0");
}
$("saveBtn").onclick=async()=>{
 if(!state.cart.length)return;
 const orders=loadOrders(),date=todayKey(),now=new Date();
 const total=cartTotal(),paymentMethod=$("paymentMethod").value;
 const payment=paymentMethod==="Transferencia" ? total : Number($("payment").value||0);
 if(payment<total){toast("El pago es insuficiente");return}
 if($("orderType").value==="Entrega"&&!$("deliveryAddress").value.trim()){toast("Escribe el domicilio de entrega");$("deliveryAddress").focus();return}
 const base={requestedTime:$("requestedTime").value,customer:$("customer").value.trim(),phone:$("phone").value.trim(),type:$("orderType").value,address:$("orderType").value==="Entrega"?$("deliveryAddress").value.trim():"",paymentMethod,products:JSON.parse(JSON.stringify(state.cart)),total,payment,change:payment-total,notes:$("notes").value.trim()};
 if(state.editingOrderId){
   const idx=orders.findIndex(o=>o.id===state.editingOrderId);
   if(idx>=0){
     const updated={...orders[idx],...base};
     try{await saveOrderToSupabase(updated);orders[idx]=updated;saveOrders(orders);state.editingOrderId=null;resetOrderForm();renderCart();renderOrders();updateStats();toast("☁️ Pedido "+updated.number+" actualizado");}
     catch(e){console.error(e);toast("⚠️ No se pudo guardar el pedido en la nube");}
     return;
   }
   state.editingOrderId=null;
 }
 const order={...base,number:makeOrderNumber(date,orders),date,createdAt:now.toISOString(),status:"Pendiente"};
 try{
   await saveOrderToSupabase(order);
   orders.push(order);saveOrders(orders);resetOrderForm();renderCart();renderOrders();updateStats();toast("☁️ Pedido "+order.number+" guardado y sincronizado");
 }catch(e){
   console.error(e);orders.push(order);saveOrders(orders);renderCart();renderOrders();updateStats();toast("⚠️ Guardado local; no se pudo sincronizar");
 }
};

function resetOrderForm(){
 state.cart=[];state.editingOrderId=null;
 $("customer").value="";$("phone").value="";$("requestedTime").value="";$("deliveryAddress").value="";$("notes").value="";$("payment").value="";
 $("orderType").value="Para recoger";toggleDeliveryAddress();
 $("paymentMethod").value="Efectivo";$("payment").disabled=false;$("payment").placeholder="$0";
 $("saveBtn").textContent="💾 GUARDAR PEDIDO";$("cancelEditBtn").style.display="none";
}

function editOrder(id){
 const o=loadOrders().find(x=>x.id===id);if(!o)return;
 if(state.cart.length && !state.editingOrderId && !confirm("Ya tienes un pedido en edición. ¿Reemplazarlo por este pedido?"))return;
 state.editingOrderId=o.id;
 state.cart=JSON.parse(JSON.stringify(o.products||[]));
 $("customer").value=o.customer||"";$("phone").value=o.phone||"";$("requestedTime").value=o.requestedTime||"";
 $("orderType").value=o.type||"Para recoger";$("deliveryAddress").value=o.address||"";$("notes").value=o.notes||"";
 $("paymentMethod").value=o.paymentMethod||"Efectivo";
 $("payment").value=o.paymentMethod==="Transferencia"?"":(o.payment??"");
 if(o.paymentMethod==="Transferencia"){ $("payment").disabled=true;$("payment").placeholder="Se registra el total"; }
 else { $("payment").disabled=false;$("payment").placeholder="$0"; }
 toggleDeliveryAddress();
 $("saveBtn").textContent="✏️ ACTUALIZAR PEDIDO "+o.number;$("cancelEditBtn").style.display="block";
 renderCart();
 document.querySelector(".cart")?.scrollIntoView({behavior:"smooth",block:"start"});
 toast("Editando pedido "+o.number);
}
$("cancelEditBtn").onclick=()=>{resetOrderForm();renderCart();toast("Edición cancelada")};

function statusClass(s){return s==="Pendiente"?"pend":s==="Preparando"?"prep":s==="Listo"?"ready":"deliv"}
function nextStatus(s){return s==="Pendiente"?"Preparando":s==="Preparando"?"Listo":s==="Listo"?"Entregado":"Entregado"}
function exportBackup(){
 const orders=loadOrders();
 const backup={app:"EL CAMACHINO",type:"pedidos-backup",version:1,exportedAt:new Date().toISOString(),orders};
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob); const a=document.createElement("a");
 a.href=url; a.download=`el_camachino_respaldo_${new Date().toISOString().slice(0,10)}.json`;
 document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
 toast(`Respaldo creado: ${orders.length} pedidos`);
}
function importBackupFile(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result), imported=Array.isArray(data)?data:data.orders;
   if(!Array.isArray(imported))throw new Error();
   const valid=imported.filter(o=>o&&typeof o==="object"&&o.id&&o.number&&o.date&&Array.isArray(o.products)&&typeof o.total!=="undefined");
   if(valid.length!==imported.length)throw new Error();
   if(!confirm(`Se encontraron ${valid.length} pedidos en el respaldo.\n\nLos pedidos actuales NO se borrarán.\nSe agregarán o actualizarán los pedidos del respaldo.\n\n¿Continuar?`))return;
   const map=new Map(loadOrders().map(o=>[o.id,o])); valid.forEach(o=>map.set(o.id,o));
   saveOrders([...map.values()].sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||""))));
   renderOrders(); updateStats(); toast(`Respaldo restaurado: ${valid.length} pedidos`);
  }catch(e){alert("No se pudo importar el respaldo.\n\nEl archivo no tiene un formato válido de EL CAMACHINO o está dañado.");}
  $("importBackup").value="";
 }; reader.readAsText(file);
}

function renderOrders(){
 const q=$("orderSearch").value.trim().toLowerCase();
 let orders=loadOrders().slice().reverse();
 if(q)orders=orders.filter(o=>{
   const txt=[o.number,o.customer,o.phone,...o.products.map(p=>p.name)].join(" ").toLowerCase();
   return txt.includes(q)||o.number.toLowerCase()===q.replace(/^#/,"#");
 });
 $("ordersList").innerHTML=orders.length?orders.map(o=>`
 <article class="order">
  <div class="order-top"><span class="order-num">${escapeHTML(o.number)}</span><span class="badge ${statusClass(o.status)}">${escapeHTML(o.status)}</span><b>${money(o.total)}</b></div>
  <div class="order-meta">${escapeHTML(o.customer||"Sin nombre")} · ${escapeHTML(o.type)}${o.address?" · 📍 "+escapeHTML(o.address):""} · ${escapeHTML(o.paymentMethod||"Efectivo")} · ${new Date(o.createdAt).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}${o.requestedTime?" · Horario: "+escapeHTML(o.requestedTime):""}</div>
  <div class="order-products">${o.products.map(p=>`${p.qty}× ${escapeHTML(p.name)}${optionText(p.options).length?" — "+optionText(p.options).map(escapeHTML).join(", "):""}`).join("<br>")}</div>
  <div class="order-actions">
   <button class="small-btn" data-edit="${o.id}">✏️ Editar pedido</button>
   ${o.status!=="Entregado"?`<button class="small-btn next-btn" data-next="${o.id}">➡️ Siguiente estado</button>`:""}
   <button class="small-btn" data-print="${o.id}">🖨️ IMPRIMIR</button>
   <button class="small-btn delete-btn" data-delete="${o.id}">Eliminar</button>
  </div>
 </article>`).join(""):'<div class="empty">No hay pedidos que coincidan.</div>';
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editOrder(b.dataset.edit));
 document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>changeStatus(b.dataset.next));
 document.querySelectorAll("[data-print]").forEach(b=>b.onclick=()=>printOrder(b.dataset.print));
 document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteOrder(b.dataset.delete));
}

function toggleDeliveryAddress(){
  const isDelivery=$("orderType").value==="Entrega";
  $("deliveryAddressWrap").style.display=isDelivery?"block":"none";
  if(!isDelivery)$("deliveryAddress").value="";
}
$("orderType").onchange=toggleDeliveryAddress;
toggleDeliveryAddress();

$("orderSearch").oninput=renderOrders;

async function changeStatus(id){
 const a=loadOrders(),o=a.find(x=>x.id===id);if(!o)return;
 const previous=o.status;o.status=nextStatus(o.status);
 try{await saveOrderToSupabase(o);saveOrders(a);renderOrders();updateStats();toast("☁️ Estado actualizado");}
 catch(e){o.status=previous;saveOrders(a);renderOrders();updateStats();toast("⚠️ No se pudo sincronizar el estado");}
}
async function deleteOrder(id){
 if(!confirm("¿Eliminar este pedido?"))return;
 try{await deleteOrderFromSupabase(id);const a=loadOrders().filter(o=>String(o.id)!==String(id));saveOrders(a);renderOrders();updateStats();toast("☁️ Pedido eliminado");}
 catch(e){console.error(e);toast("⚠️ No se pudo eliminar en la nube");}
}
function updateStats(){
 const d=todayKey(),a=loadOrders().filter(o=>o.date===d);
 $("todayOrders").textContent=a.length;
 $("todaySales").textContent=money(a.reduce((s,o)=>s+o.total,0));
 $("todayPending").textContent=a.filter(o=>o.status!=="Entregado").length;
}
function printOrder(id){
 const o=loadOrders().find(x=>x.id===id);if(!o)return;
 $("printArea").innerHTML=`<div class="ticket">
 <h1>EL CAMACHINO</h1><div class="center">PEDIDO ${escapeHTML(o.number)}</div><hr>
 <div>Cliente: ${escapeHTML(o.customer||"—")}</div>
 <div>Hora: ${new Date(o.createdAt).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}</div>
 <div>Horario solicitado: ${escapeHTML(o.requestedTime||"—")}</div>
 <div>Tipo: ${escapeHTML(o.type)}</div>
 ${o.address?`<div>Domicilio: ${escapeHTML(o.address)}</div>`:""}
 <div>Forma de pago: ${escapeHTML(o.paymentMethod||"Efectivo")}</div><hr>
 <b>PRODUCTOS</b>
 ${o.products.map(p=>`<div class="prod"><div class="row"><span class="prod-name">${p.qty}× ${escapeHTML(p.name)}</span><span>${money(p.price*p.qty)}</span></div>${optionText(p.options).map(x=>`<div class="sub">${escapeHTML(x)}</div>`).join("")}</div>`).join("")}
 <hr><div class="row grand"><span>TOTAL:</span><span>${money(o.total)}</span></div>
 <div class="row"><span>Pagó:</span><span>${money(o.payment)}</span></div>
 <div class="row"><span>Cambio:</span><span>${money(o.change)}</span></div>
 ${o.notes?`<hr><b>Notas:</b><div>${escapeHTML(o.notes)}</div>`:""}
 </div>`;
 window.print();
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1800)}

$("paymentMethod").value="Efectivo";
$("payment").disabled=false;
$("exportBackup").onclick=exportBackup;
$("importBackupBtn").onclick=()=>$("importBackup").click();
$("importBackup").onchange=e=>importBackupFile(e.target.files[0]);

// ===== Controles móviles =====
function updateMobileCart(){
  const count=state.cart.reduce((s,i)=>s+i.qty,0);
  const total=cartTotal();
  const c=$("mobileCartCount"), t=$("mobileCartTotal"), top=$("mobileTopCount");
  if(c)c.textContent=count;
  if(t)t.textContent=money(total);
  if(top)top.textContent=count;
}
function openMobileCart(){
  document.body.classList.add("mobile-cart-open");
  const c=$("mobileCartBar");
  if(c)c.style.display="block";
}
function closeMobileCart(){
  document.body.classList.remove("mobile-cart-open");
}
$("mobileCartOpen").onclick=openMobileCart;
$("mobileTopCart").onclick=openMobileCart;
$("mobileCartBackdrop").onclick=closeMobileCart;

// Cerrar hoja del carrito con Escape.
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeMobileCart();
});

// Mantener el resumen móvil sincronizado.
const __oldRenderCart=renderCart;
renderCart=function(){
  __oldRenderCart();
  updateMobileCart();
};

// Después de guardar un pedido, volver automáticamente al catálogo.
const __oldSaveClick=$("saveBtn").onclick;
$("saveBtn").onclick=function(){
  __oldSaveClick();
  updateMobileCart();
  if(!state.cart.length) closeMobileCart();
};


function renderAdmin(){
  const body=$("adminBody");
  body.innerHTML=`<div class="admin-list">${
    PRODUCTS.map(p=>`
      <div class="admin-row">
        <div class="admin-row-top">
          <div>
            <div class="admin-row-name">${escapeHTML(p.name)}</div>
            <div class="admin-muted">${escapeHTML(p.cat)} · ${money(p.price)} · ${p.active===false?"DESACTIVADO":"ACTIVO"}</div>
          </div>
          <span>${p.active===false?"⛔":"✅"}</span>
        </div>
        <div class="admin-actions">
          <button class="small-btn" data-edit-product="${p.id}">✏️ Editar</button>
          <button class="small-btn" data-toggle-product="${p.id}">${p.active===false?"👁️ Activar":"🚫 Desactivar"}</button>
        </div>
      </div>`).join("")
  }</div>`;
  body.querySelectorAll("[data-edit-product]").forEach(b=>b.onclick=()=>adminEdit(b.dataset.editProduct));
  body.querySelectorAll("[data-toggle-product]").forEach(b=>b.onclick=async()=>{
    const p=PRODUCTS.find(x=>x.id===b.dataset.toggleProduct); if(!p)return;
    const previous=p.active; p.active=p.active===false;
    try{ await saveProductToSupabase(p); saveCatalogLocal(); renderCatalog(); renderAdmin(); toast(p.active?"☁️ Producto activado":"☁️ Producto desactivado"); }
    catch(e){ p.active=previous; console.error(e); toast("❌ No se pudo guardar en la nube"); }
  });
}
function adminForm(p){
  const editing=!!p;
  const x=p||{id:"",name:"",price:0,cat:CATEGORIES[0]||"General",desc:"",active:true,allowMango:false,allowPulpo:false,askColor:false,askSpicy:false,askTostitosColor:false,askShrimpStyle:false};
  return `<div class="admin-form">
    <label>Nombre<input id="aName" value="${escapeHTML(x.name)}"></label>
    <label>Precio<input id="aPrice" type="number" min="0" step="1" value="${Number(x.price||0)}"></label>
    <label>Categoría<select id="aCat">${CATEGORIES.map(c=>`<option ${c===x.cat?"selected":""}>${escapeHTML(c)}</option>`).join("")}</select></label>
    <label>Descripción<input id="aDesc" value="${escapeHTML(x.desc||"")}"></label>
    <div><b>Opciones del producto</b></div>
    <div class="admin-checks">
      <label class="admin-check"><input type="checkbox" id="aMango" ${x.allowMango?"checked":""}> Permitir mango +$5</label>
      <label class="admin-check"><input type="checkbox" id="aPulpo" ${x.allowPulpo?"checked":""}> Permitir pulpo +$5</label>
      <label class="admin-check"><input type="checkbox" id="aColor" ${x.askColor?"checked":""}> Preguntar color de aguachile</label>
      <label class="admin-check"><input type="checkbox" id="aSpicy" ${x.askSpicy?"checked":""}> Preguntar picor</label>
      <label class="admin-check"><input type="checkbox" id="aTostitos" ${x.askTostitosColor?"checked":""}> Preguntar color de Tostitos</label>
      <label class="admin-check"><input type="checkbox" id="aShrimpStyle" ${x.askShrimpStyle?"checked":""}> 🍤 Preguntar tipo de camarón (Cocido / Curtido)</label>
    </div>
    <div class="modal-actions">
      <button id="adminCancel">Cancelar</button>
      <button class="confirm" id="adminSave">${editing?"Guardar cambios":"Crear producto"}</button>
    </div>
  </div>`;
}
function adminEdit(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p)return;
  $("adminBody").innerHTML=adminForm(p);
  $("adminCancel").onclick=renderAdmin;
  $("adminSave").onclick=async()=>{
    const previous={...p};
    p.name=$("aName").value.trim();
    p.price=Number($("aPrice").value||0);
    p.cat=$("aCat").value;
    p.desc=$("aDesc").value.trim();
    p.allowMango=$("aMango").checked;p.allowPulpo=$("aPulpo").checked;
    p.askColor=$("aColor").checked;
    p.askSpicy=$("aSpicy").checked;
    p.askTostitosColor=$("aTostitos").checked;
    p.askShrimpStyle=$("aShrimpStyle").checked;

    if(p.modal!=="aguachile" && p.modal!=="tostiaguachile" && p.modal!=="tostadaAguachile" &&
       p.modal!=="tostadaExtras" && p.modal!=="tostadaPulpo" && p.modal!=="ceviche"){
      p.modal=(p.askTostitosColor||p.askColor||p.askSpicy||p.allowMango||p.allowPulpo||p.askShrimpStyle)?"custom":undefined;
    }
    try{
      await saveProductToSupabase(p);
      saveCatalogLocal(); renderCatalog(); renderAdmin(); toast("☁️ Producto guardado en la nube");
    }catch(e){
      Object.assign(p,previous);
      console.error(e); toast("❌ No se pudo guardar en la nube");
    }
  };
}
function adminNew(){
  $("adminBody").innerHTML=adminForm(null);
  $("adminCancel").onclick=renderAdmin;
  $("adminSave").onclick=async()=>{
    const name=$("aName").value.trim(),price=Number($("aPrice").value||0),cat=$("aCat").value;
    if(!name){toast("Escribe un nombre");return}
    const allowMango=$("aMango").checked,allowPulpo=$("aPulpo").checked;
    const askColor=$("aColor").checked,askSpicy=$("aSpicy").checked,askTostitosColor=$("aTostitos").checked,askShrimpStyle=$("aShrimpStyle").checked;
    const p={id:"prod-"+Date.now(),name,price,cat,desc:$("aDesc").value.trim(),active:true,
      allowMango,allowPulpo,askColor,askSpicy,askTostitosColor,askShrimpStyle,
      modal:(allowMango||allowPulpo||askColor||askSpicy||askTostitosColor||askShrimpStyle)?"custom":undefined};
    try{
      await saveProductToSupabase(p);
      PRODUCTS.push(p); saveCatalogLocal(); renderCatalog(); renderAdmin(); toast("☁️ Producto creado en la nube");
    }catch(e){ console.error(e); toast("❌ No se pudo crear el producto en la nube"); }
  };
}
function openAdmin(){$("adminBack").classList.add("show");renderAdmin()}
$("adminBtn").onclick=openAdmin; if($("topAdminBtn")) $("topAdminBtn").onclick=openAdmin;
$("adminBack").onclick=e=>{if(e.target===$("adminBack"))$("adminBack").classList.remove("show")};
$("adminNew").onclick=adminNew;
$("adminNewCat").onclick=()=>{
  const name=prompt("Nombre de la nueva categoría:");
  if(!name||!name.trim())return;
  const c=name.trim();
  if(CATEGORIES.includes(c)){toast("Esa categoría ya existe");return}
  (async()=>{
    try{ await saveCategoryToSupabase(c); CATEGORIES.push(c); saveCatalogLocal(); renderCatalog(); renderAdmin(); toast("☁️ Categoría creada en la nube"); }
    catch(e){ console.error(e); toast("❌ No se pudo crear la categoría en la nube"); }
  })();
};

renderCatalog();renderCart();renderOrders();updateStats();
syncCatalogFromSupabase();
</script>
